name: Build-c3mini
on:

  workflow_dispatch:
    inputs:
      meshtastic_firmware_ref:
        description: Meshtastic firmware ref
        required: true
        type: string
        default: develop
      create_release:
        description: Create Release
        required: false
        type: boolean
        default: false
      # TODO: Add manual overrides for release (prerelease, name, body, etc)

  workflow_call:
    inputs:
      meshtastic_firmware_ref:
        description: Meshtastic firmware ref
        required: true
        type: string
        default: develop
      create_release:
        description: Create Release
        required: false
        type: boolean
        default: false

env:
  meshtastic_firmware_ref: ${{ inputs.meshtastic_firmware_ref || 'develop' }}

jobs:
  build:
    name: ${{ matrix.arch }} ${{ matrix.board }}
    strategy:
      fail-fast: false
      matrix:
        include:

          - arch: esp32c3
            board: c3mini
            artifact-paths: |
              release/*.bin

    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: checkout_meshtastic
        uses: actions/checkout@v5
        name: Checkout radiolee firmware
        with:
          repository: radiolee/firmware
          ref: ${{ env.meshtastic_firmware_ref }}

      - id: checkout_custom
        uses: actions/checkout@v5
        name: Checkout this repo (custom changes)
        with:
          path: .custom
      # - run: cp -r .custom/firmware/* ./

      - name: Get release version string
        shell: bash
        run: echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
        id: version

      - id: build
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: ${{ matrix.arch }}
          pio_env: ${{ matrix.board }}

      - name: Store binaries as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.arch }}-${{ matrix.board }}
          overwrite: true
          path: |
            ${{ matrix.artifact-paths }}
